[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-resolver"
version = "0.1.0"
description = "Fetch PR feedback and run a local coding agent without publishing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pr-resolver = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts", "prompts"]

[tool.setuptools.package-data]
prompts = ["*.md"]
